name: Update US Market 20 Core Charts Dashboard

on:
  schedule:
    # 每周六 UTC 00:00 (北京时间周六 08:00，美股周五收盘及CFTC报告发布后) 自动运行
    - cron: '0 0 * * 6'
  workflow_dispatch: # 允许在 GitHub Actions 界面手动一键触发

jobs:
  build-and-update-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data pipeline & update Google Sheets charts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python build_dashboard.py
