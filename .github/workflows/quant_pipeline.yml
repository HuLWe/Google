name: Pyramid Quant V5.3 Multi-Screen Daily Pipeline

on:
  schedule:
    # 协调世界时 UTC 21:00 (相当于美东收盘后 17:00 / 北京时间清晨 05:00 自动触发)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # 支持 GitHub 控制台手动一键触发

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 执行多屏量化流水线并推送至谷歌表格
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SEC_USER_AGENT: "QuantResearchAdmin admin@example.com"
          AI_MODEL_NAME: "gpt-astra-6.2"
        run: |
          python src/main_pipeline.py
