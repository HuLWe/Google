name: 美股金字塔量化投研 V5.3 每日多屏流水线

on:
  schedule:
    # 世界协调时 UTC 21:00（北京时间每个工作日 05:00 自动运行）
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 控制台或谷歌表格菜单中手动触发

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 执行量化流水线并推送至谷歌表格
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          AI_BASE_URL: "https://api.starwish.fit"
          AI_MODEL_NAME: "gpt-astra-6.2"
          SEC_USER_AGENT: "QuantResearchAdmin admin@example.com"
        run: |
          python src/main_pipeline.py
