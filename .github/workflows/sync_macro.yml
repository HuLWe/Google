    derived, blackswan, countries, ts_dict, report = analyze_macro_and_blackswan(obs_map, wb_map, imf_map, extra, mkt_stats)
    sync_all_sheets(all_raw, cross_rows, derived, blackswan, countries, ts_dict, report)
    print(f"[SUCCESS] Synced {len(all_raw)} metrics ({len(cross_rows)} cross-assets) and updated narrative report.")
